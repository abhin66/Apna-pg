<html lang="en" data-t="light"><head><meta charset="utf-8">

<style>
:root{--bg:#f4f4f5;--bg2:#ebebed;--card:#ffffff;--tx:#09090b;--tx2:#6b6b73;--bd:rgba(9,9,11,.09);--inv:#09090b;--invt:#fafafa;--sh:0 16px 44px rgba(9,9,11,.1);--ok:#0f9d68;--warn:#c97d08;--err:#df3550;--e:cubic-bezier(.22,1,.36,1);--sp:cubic-bezier(.34,1.3,.5,1);color-scheme:light}
[data-t=dark]{--bg:#000;--bg2:#17171a;--card:#0d0d0f;--tx:#fafafa;--tx2:#a0a0a8;--bd:rgba(255,255,255,.1);--inv:#fafafa;--invt:#000;--sh:0 16px 48px rgba(0,0,0,.8);--ok:#2fd69a;--warn:#ffb84d;--err:#ff647c;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums;overflow:hidden;transition:background .4s,color .4s;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.5s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
#app{width:100%;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"m" "n"}
#app.lg{display:grid;place-items:center;overflow-y:auto;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--tx) 9%,transparent),transparent 60%)}
.mw{grid-area:m;display:flex;flex-direction:column;min-height:0}
aside{grid-area:n}.brand{display:none}
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header small{color:var(--tx2);font-size:12px;font-weight:600;text-transform:capitalize}
header h1{font-size:26px;font-weight:800;letter-spacing:-.025em}
.ha{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;position:relative;transition:transform .3s var(--sp),background .3s}
.ib:active{transform:scale(.88)}.ib svg{grid-area:1/1;transition:transform .6s var(--e),opacity .4s}
[data-t=dark] .sun,[data-t=light] .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
main{flex:1;overflow-y:auto;padding:10px 18px 24px;scrollbar-width:none;transition:opacity .15s,transform .15s}main::-webkit-scrollbar{display:none}
main.out{opacity:0;transform:translateY(10px)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 16px;align-items:start;max-width:1000px}
.pg>*{animation:up .6s var(--e) backwards}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}.pg>*:nth-child(5){animation-delay:.2s}.pg>*:nth-child(n+6){animation-delay:.25s}
.pg.ns>*{animation:none}.w{grid-column:1/-1}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.985)}}
nav{position:relative;display:flex;width:min(460px,calc(100% - 24px));justify-self:center;margin:0 auto calc(env(safe-area-inset-bottom) + 10px);padding:6px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n));border-radius:18px;background:var(--inv);transform:translateX(calc(var(--i)*100%));transition:transform .6s var(--sp)}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0;min-height:56px;font-size:11px;font-weight:700;color:var(--tx2);transition:color .35s}
nav button svg{transition:transform .5s var(--sp)}nav button.on{color:var(--invt)}nav button.on svg{transform:scale(1.12)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(9,9,11,.05);transition:transform .4s var(--e),box-shadow .4s,background .4s,border-color .3s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--sh)}}
.lbl{color:var(--tx2);font-size:12px;font-weight:700;margin:6px 4px 8px;display:block}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--invt) 24%,transparent),transparent);pointer-events:none}.hero{position:relative;overflow:hidden;border-radius:28px;padding:24px;margin-bottom:16px;background:linear-gradient(150deg,var(--inv),color-mix(in srgb,var(--inv) 78%,var(--tx2)));color:var(--invt);transition:box-shadow .8s,background .4s}
.hero.loss{box-shadow:0 0 0 1px var(--err),0 20px 60px color-mix(in srgb,var(--err) 30%,transparent)}.hero.ok{box-shadow:0 0 0 1px var(--ok),0 20px 60px color-mix(in srgb,var(--ok) 32%,transparent)}
.hero small{opacity:.7;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}.hero .big{font-size:clamp(38px,11vw,52px);font-weight:800;letter-spacing:-.04em;margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--invt) 15%,transparent);font-size:12px;font-weight:700;margin:6px 6px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:10px}.row+.row{border-top:1px solid var(--bd)}
.card.row{padding:16px}.mut{color:var(--tx2);font-size:12px}
.btn{width:100%;padding:16px;min-height:52px;font-size:15px;border-radius:16px;font-weight:800;background:var(--inv);color:var(--invt);transition:transform .3s var(--sp),opacity .3s;display:flex;justify-content:center;gap:8px;align-items:center;margin-bottom:16px}
.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.6}.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.nm{display:block;font-weight:800;font-size:inherit;text-align:left;padding:3px 0;min-height:30px}.nm::after{content:' ›';color:var(--tx2)}.nm:hover{text-decoration:underline}.sm{padding:10px 16px;min-height:40px;border-radius:12px;font-size:12px;font-weight:800;background:var(--bg2);border:1px solid var(--bd);transition:transform .3s var(--sp)}.sm:active{transform:scale(.9)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:16px}
.seg button{min-width:0;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:700;color:var(--tx2);transition:all .4s var(--e)}
.seg button.on{background:var(--inv);color:var(--invt);border-color:var(--inv);transform:translateY(-2px)}
input,select,textarea{width:100%;font-size:16px;min-height:48px;padding:13px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd);margin-bottom:12px;transition:border-color .3s,box-shadow .3s,background .4s;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--tx);box-shadow:0 0 0 4px color-mix(in srgb,var(--tx) 10%,transparent)}
.bad{border-color:var(--err)!important;animation:shake .4s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tile{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tile div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:center}
.tile b{font-size:clamp(20px,6.5vw,26px);font-weight:800;display:block}.tile span{font-size:12px;color:var(--tx2);font-weight:700}
.badge{padding:5px 11px;border-radius:99px;font-size:11px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);display:inline-block}
.b0{--c:var(--err)}.b1{--c:var(--warn)}.b2{--c:var(--tx)}.b3{--c:var(--ok)}
.tl div{display:flex;gap:12px;align-items:center;padding:9px 0;position:relative;color:var(--tx2);font-size:14px;font-weight:700}
.tl div::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg2);border:2px solid var(--bd);flex:none;z-index:1;transition:all .6s var(--e)}
.tl div::after{content:"";position:absolute;left:5px;top:28px;height:100%;width:2px;background:var(--bd)}.tl div:last-child::after{display:none}
.tl .d{color:var(--tx)}.tl .d::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 12px var(--ok)}
.tl .c::before{border-color:var(--tx);background:var(--tx);animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 var(--tx2)}100%{box-shadow:0 0 0 8px transparent}}
.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;padding:4px 2px}
.days button{flex:1;min-width:48px;padding:11px 0;border-radius:16px;background:var(--card);border:1px solid var(--bd);color:var(--tx2);font-size:11px;font-weight:700;transition:all .45s var(--sp)}
.days b{display:block;font-size:17px;color:inherit;margin-top:2px}.days .on{background:var(--inv);color:var(--invt);transform:translateY(-4px);box-shadow:var(--sh)}
.sw{width:52px;height:30px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd);position:relative;flex:none;transition:background .4s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--tx2);transition:transform .5s var(--sp),background .3s}
.sw.on{background:var(--inv)}.sw.on::after{transform:translateX(22px);background:var(--invt)}
.stars button{font-size:24px;color:var(--bd);transition:transform .3s var(--sp),color .2s}.stars .on{color:var(--warn);transform:scale(1.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px}
.bed{aspect-ratio:1.15;border-radius:14px;font-size:12px;font-weight:800;border:1px solid;transition:all .5s var(--e)}.bed:active{transform:scale(.88)}
.bed.o{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.bed.v{background:var(--inv);border-color:var(--inv);color:var(--invt);transform:scale(1.04)}
.bed.n{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn)}
.leg{display:flex;gap:16px;margin-top:16px;font-size:12px;color:var(--tx2);font-weight:700;flex-wrap:wrap}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:12px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--tx2);font-weight:700}
.pb{display:block;height:100%;border-radius:9px;background:var(--invt);width:0;transition:width 1.2s var(--e)}.bar{width:100%;border-radius:8px 8px 4px 4px;background:var(--inv);height:0;transition:height 1.1s var(--e)}
.doc{padding:14px;border-radius:16px;background:var(--bg2);border:1px solid var(--bd);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;transition:all .4s var(--e)}
.doc.on{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 100px);max-width:420px;margin:auto;padding:14px 18px;border-radius:16px;background:var(--inv);color:var(--invt);font-size:14px;font-weight:700;animation:up .5s var(--sp);z-index:40;box-shadow:var(--sh);transition:opacity .3s,transform .3s}.toast.x{opacity:0;transform:translateY(12px)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .3s both;backdrop-filter:blur(3px)}
.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:var(--bd);margin:-12px auto 18px}.sheet{max-height:90dvh;overflow-y:auto;width:100%;max-width:460px;background:var(--bg);border-radius:28px 28px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 28px);border:1px solid var(--bd);animation:sl .6s var(--e)}
@keyframes fade{from{opacity:0}}@keyframes sl{from{transform:translateY(100%)}}
.ck{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,transparent);display:grid;place-items:center;color:var(--ok);box-shadow:0 0 44px color-mix(in srgb,var(--ok) 45%,transparent);animation:pop .7s var(--sp)}
.ck path{stroke-dasharray:30;animation:dr .6s .3s var(--e) backwards}@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes dr{from{stroke-dashoffset:30}}
.sp{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--invt) 30%,transparent);border-top-color:var(--invt);border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{rotate:1turn}}
.login{width:100%;max-width:400px;padding:30px 26px;animation:up .8s var(--e)}
.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:var(--inv);color:var(--invt);display:grid;place-items:center;box-shadow:var(--sh);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-7px)}}
.otp{display:flex;gap:10px;margin-bottom:14px}.otp input{text-align:center;font-size:22px;font-weight:800;padding:14px 0;margin:0}.hide{display:none}
.mw,aside,main,.pg>*,header>div,.row>div{min-width:0}
.row{flex-wrap:wrap}.row>:last-child{margin-left:auto}
.seg.f{grid-template-columns:repeat(4,1fr)}.seg.f button{font-size:12px;padding:12px 2px}
.days{gap:6px}.days button{min-width:0}
@media(max-width:380px){header{padding-left:14px;padding-right:14px}header h1{font-size:23px}main{padding:8px 14px 20px}.card{padding:14px}.hero{padding:20px}.chip{font-size:11px}}
@media(min-width:600px) and (max-width:859px){header{padding-left:30px;padding-right:30px}main{padding:14px 30px 28px}}
@media(min-width:860px){
#app:not(.lg){grid-template-columns:250px minmax(0,1fr);grid-template-rows:100%;grid-template-areas:"n m"}
aside{border-right:1px solid var(--bd);padding:26px 14px;background:var(--card);transition:background .4s}
.brand{display:flex;align-items:center;gap:12px;margin:0 8px 28px;font-weight:800;font-size:18px}.brand i{width:40px;height:40px;border-radius:13px;background:var(--inv);color:var(--invt);display:grid;place-items:center}
nav{flex-direction:column;width:auto;justify-self:stretch;margin:0;padding:6px;gap:4px;box-shadow:none;border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
nav .ind{width:calc(100% - 12px);height:48px;bottom:auto;transform:translateY(calc(var(--i)*52px))}
nav button{flex:none;height:48px;min-height:0;justify-content:flex-start;flex-direction:row;gap:12px;padding:0 16px;font-size:14px}
header{padding:32px 36px 10px}header h1{font-size:32px}main{padding:14px 36px 40px}
.toast{bottom:28px}.ov{align-items:center}.sheet{border-radius:28px;max-width:420px}
}
@media(prefers-reduced-motion:reduce){*,::view-transition-group(*){animation:none!important;transition:none!important}}
</style></head>

pay(){const b=$('#pay');b.disabled=true;b.innerHTML='<i class="sp"></i> Processing';setTimeout(()=>{S.paid=true;S.tab=0;soft();sheet(`<div class="ck">${ic('ok',38)}</div><h2 style="text-align:center">Payment successful</h2><p class="mut" style="text-align:center;margin:6px 0 20px">${S.pay} · demo transaction</p><button class="btn" style="margin:0" data-a="close">Done</button>`)},1100)},
rcpt(v){const[m,a]=v.split('|');sheet(`<h2 style="margin-bottom:8px">Receipt</h2><div class="row"><span class="mut">Month</span><b>${m}</b></div><div class="row"><span class="mut">Room</span><b>203 · Bed B</b></div><div class="row"><span class="mut">Amount</span><b>${inr(a)}</b></div><div class="row"><span class="mut">Status</span><b style="color:var(--ok)">Paid</b></div><button class="btn ghost" style="margin:16px 0 0" data-a="close">Close</button>`)},
cat(v){S.cat=v;soft()},send(){const d=$('#desc');if(!d.value.trim()){bad(d);return toast('Describe the problem first')}S.comps.unshift({t:S.cat+': '+d.value.trim().slice(0,40),r:'203',c:S.cat,st:0,me:1});d.value='';soft();toast('Complaint submitted')},
day(v){S.day=+v;soft()},skip(){S.cancel[S.day]=!S.cancel[S.day];soft();toast(S.cancel[S.day]?'Meals skipped for '+DN[S.day]:'Meals restored')},star(v){S.rating=+v;soft()},
filter(v){S.filter=v;soft()},adv(v){const c=S.comps[+v];c.st++;soft();toast(c.st==3?'Marked resolved':'Status: '+stat(c.st))},
doc(v){S.docs[v]=!S.docs[v];soft()},
save(){const n=$('#nm'),m=$('#mb'),b=$('#bd');if(!n.value.trim()){bad(n);return toast('Enter the tenant’s name')}if(!/^\d{10}$/.test(m.value)){bad(m);return toast('Enter a valid mobile number')}if(!b.value)return toast('No vacant bed to assign');if(S.beds[b.value]!='v')return toast('That bed is already occupied');const nm=n.value;S.tenants.push({n:nm,bed:b.value,rent:+$('#rn').value||0,dep:+$('#dp').value||0,paid:false,d:'',ph:m.value,j:'10 Nov 2026',docs:{...S.docs}});S.beds[b.value]='o';S.docs={};n.value=m.value='';soft();toast(nm+' saved · bed '+b.value+' is now occupied')},
pview(v){S.pv=v;soft()},pmonth(v){S.pm=+v;S.pv='Month';soft()},
expo(){sheet(`<h2 style="margin-bottom:12px">Add expense</h2><span class="lbl">Category</span><select id="ec">${CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><span class="lbl">Amount</span><input id="ea" type="number" inputmode="numeric" placeholder="e.g. 1800"><button class="btn" data-a="expadd">Add expense</button><button class="btn ghost" style="margin:0" data-a="close">Cancel</button>`)},
expadd(){const a=+$('#ea').value,k=+$('#ec').value;if(!(a>0)){bad($('#ea'));return toast('Enter an amount')}S.exp[k]+=a;document.querySelectorAll('.ov').forEach(o=>o.remove());soft();toast(CATS[k]+' expense added')},
tview(v){openT(+v)},tdoc(v){const[i,k]=v.split('|');S.tenants[+i].docs[k]=true;openT(+i);toast(k+' updated')},
tdel(v){const t=S.tenants[+v];document.querySelectorAll('.ov').forEach(o=>o.remove());sheet(`<h2 style="margin-bottom:6px">Delete ${t.n}?</h2><p class="mut" style="line-height:1.6;margin-bottom:18px;font-size:14px">This removes their record and documents. Bed ${t.bed} becomes vacant. This cannot be undone.</p><button class="btn" style="background:var(--err);color:#fff;margin-bottom:10px" data-a="tkill" data-v="${v}">Delete tenant</button><button class="btn ghost" style="margin:0" data-a="close">Cancel</button>`)},
tkill(v){const t=S.tenants[+v];S.beds[t.bed]='v';S.tenants.splice(+v,1);document.querySelectorAll('.ov').forEach(o=>o.remove());soft();toast(t.n+' deleted · bed '+t.bed+' is vacant')},
tfilter(v){S.tf=v;soft()},paid(v){const t=S.tenants[+v];t.paid=true;t.d='10 Nov';soft();toast(t.n+' marked as paid')},
remind(){toast('WhatsApp is not connected yet. Add provider credentials in settings.')},
csv(){const t='Room,Tenant,Amount,Status\n'+S.tenants.map(x=>[x.bed,x.n,x.rent,x.paid?'Paid':'Unpaid'].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='rent-report.csv';a.click();toast('Report downloaded')},
bed(v){S.beds[v]={o:'n',n:'v',v:'o'}[S.beds[v]];if(S.beds[v]=='v')S.tenants=S.tenants.filter(t=>t.bed!=v);soft()},
shareV(){const v=Object.keys(S.beds).filter(k=>S.beds[k]=='v'),t='Vacant beds: '+v.join(', ')+' · ₹7,500/month';navigator.share?navigator.share({title:'Aapka PG',text:t}).catch(()=>{}):navigator.clipboard?.writeText(t).then(()=>toast('Vacancy list copied'))}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&AC[a.dataset.a])AC[a.dataset.a](a.dataset.v,a)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.o!==undefined){t.value=t.value.replace(/\D/g,'');const n=document.querySelector(`[data-o="${+t.dataset.o+1}"]`);if(t.value&&n)n.focus()}else if(t.id==='ph'||t.id==='mb')t.value=t.value.replace(/\D/g,'')});
document.addEventListener('keydown',e=>{if(e.key==='Backspace'&&e.target.dataset?.o>0&&!e.target.value)document.querySelector(`[data-o="${e.target.dataset.o-1}"]`).focus()});
login();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').then(r=>r.addEventListener('updatefound',()=>toast('A new version is ready. Reload to update.'))).catch(()=>{});
</script></body></html>
